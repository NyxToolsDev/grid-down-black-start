<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#050807">
<title>Grid Down: Black Start</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
:root{
  --bg:#050807; --live:#33ff66; --dim:#1a8040; --dead:#0d3520;
  --text:#d8ffe0; --amber:#ffb000; --red:#e0301e; --panel:#08120c;
}
*{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent;}
html,body{height:100%; overflow:hidden; background:var(--bg);}
body{
  font-family:ui-monospace,'Cascadia Mono',Consolas,'Courier New',monospace;
  color:var(--text); font-size:14px; letter-spacing:.4px;
}
#board{position:fixed; inset:0; width:100%; height:100%; touch-action:none;}
#scan{position:fixed; inset:0; pointer-events:none; z-index:50;
  background:repeating-linear-gradient(0deg, rgba(0,0,0,.14) 0 1px, transparent 1px 3px);}
#vig{position:fixed; inset:0; pointer-events:none; z-index:51;
  background:radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,.5) 100%);}
.hidden{display:none !important;}
.overlay{position:fixed; inset:0; z-index:100; overflow-y:auto;
  background:rgba(3,6,4,.92); padding:20px; padding-bottom:env(safe-area-inset-bottom);}
.center{display:flex; flex-direction:column; align-items:center; justify-content:center;
  min-height:100%; text-align:center; gap:12px; max-width:520px; margin:0 auto;}
h1{color:var(--live); font-size:clamp(26px,7vw,44px); font-weight:400;
  letter-spacing:6px; text-shadow:0 0 18px rgba(51,255,102,.5);}
h2{color:var(--amber); font-size:clamp(14px,4vw,20px); letter-spacing:8px; font-weight:400;}
.tagline{color:var(--dim); max-width:420px; line-height:1.5;}
button{
  font:inherit; color:var(--text); background:var(--panel);
  border:1px solid var(--dim); padding:12px 16px; min-height:44px;
  cursor:pointer; letter-spacing:1px;
}
button:hover{border-color:var(--live); color:var(--live);}
.t-open{width:100%; max-width:380px; text-align:left; line-height:1.4;}
.t-open small{display:block; color:var(--dim); letter-spacing:.3px;}
.mono{letter-spacing:1px;}
.amber{color:var(--amber);} .red{color:var(--red);}
/* cold open */
#coldopen .center{gap:24px;}
#co-h{color:var(--amber); letter-spacing:4px; font-size:18px;}
#co-p{line-height:1.7; max-width:460px; text-align:left; color:var(--text);}
/* briefing sheet */
#brief{position:fixed; left:0; right:0; bottom:0; z-index:110;
  max-height:76vh; overflow-y:auto; background:rgba(5,10,7,.96);
  border-top:1px solid var(--dim); padding:14px 14px calc(14px + env(safe-area-inset-bottom));
  box-shadow:0 -8px 40px rgba(0,0,0,.7);}
.b-head{display:flex; flex-wrap:wrap; gap:6px 18px; align-items:baseline; margin-bottom:10px;}
.b-day{color:var(--live); font-size:18px; letter-spacing:3px;}
.b-stat{color:var(--text); font-size:12px;}
.b-sect{color:var(--amber); font-size:11px; letter-spacing:2px; margin:12px 0 6px;
  border-bottom:1px solid var(--dead); padding-bottom:3px;}
.b-recap summary{color:var(--dim); cursor:pointer; font-size:12px; letter-spacing:2px; padding:4px 0;}
.b-log{max-height:180px; overflow-y:auto; padding:6px; background:rgba(0,0,0,.3);}
.b-log div, .l-line{font-size:12px; line-height:1.6; white-space:pre-wrap; color:var(--text);}
.b-alarm{color:var(--red) !important;}
.b-human{color:var(--dim) !important; font-style:italic;}
.b-clock{font-size:12px; padding:2px 0; color:var(--text);}
.b-clock.amber{color:var(--amber);}
.b-row{display:flex; gap:8px; margin:6px 0;}
.b-row.wrap{flex-wrap:wrap;}
.b-choice{flex:1; font-size:12px;}
.b-choice.sel{border-color:var(--live); color:var(--live); background:rgba(51,255,102,.08);}
.b-choice.block{display:block; width:100%; margin-top:8px; text-align:left;}
.b-job{display:flex; justify-content:space-between; align-items:center; gap:8px;
  padding:9px 8px; border:1px solid var(--dead); margin:4px 0; cursor:pointer; font-size:12px;}
.b-job.sel{border-color:var(--live); background:rgba(51,255,102,.07);}
.b-joblabel{line-height:1.5;}
.b-dim{color:var(--dim);}
.b-chips{display:flex; gap:4px;}
.b-chip{padding:4px 8px; min-height:28px; font-size:11px;}
.b-chip.on{border-color:var(--live); color:var(--live);}
.b-chip.night{border-color:var(--amber); color:var(--amber);}
.b-crew{padding:8px 10px; font-size:12px;}
.b-crew.busy{opacity:.45;}
.b-crew.out{opacity:.3; border-style:dashed;}
.b-crew.hot{border-color:var(--red);}
.pips{color:var(--amber); font-size:9px; letter-spacing:1px;}
.b-warn{color:var(--amber); font-size:11px; margin-top:6px; line-height:1.5;}
.b-island{padding:6px 8px; margin:8px 0 4px; font-size:12px; border-left:3px solid var(--live);}
.b-island.tight{border-left-color:var(--amber); color:var(--amber);}
.b-island.critical{border-left-color:var(--red); color:var(--red);}
.b-zone{display:flex; justify-content:space-between; align-items:center; gap:8px;
  padding:6px 4px 6px 14px; font-size:12px; border-bottom:1px dotted var(--dead);}
.b-stepper{display:flex; align-items:center; gap:6px;}
.b-step{width:38px; min-height:38px; padding:0; font-size:16px;}
.b-pk{min-width:34px; text-align:center; color:var(--live);}
.b-commit{display:block; width:100%; margin-top:16px; padding:16px;
  border-color:var(--live); color:var(--live); font-size:14px; letter-spacing:3px;}
.b-commit.danger{border-color:var(--red); color:var(--red);}
/* event modal */
#eventmodal{display:flex; align-items:center; justify-content:center; z-index:130;}
.ev-card{max-width:460px; width:100%; background:var(--panel);
  border:1px solid var(--dim); padding:18px;}
#ev-cat{color:var(--amber); font-size:11px; letter-spacing:3px; margin-bottom:12px;}
#ev-text{line-height:1.7; font-size:13px; margin-bottom:8px; white-space:pre-wrap;}
/* log screen */
#logscreen{z-index:130; display:flex; flex-direction:column; padding:16px;}
#log-lines{flex:1; overflow-y:auto; max-width:640px; width:100%; margin:0 auto; padding-bottom:12px;}
#log-next{max-width:640px; width:100%; margin:0 auto; border-color:var(--live); color:var(--live);}
/* sheet */
#sheet{position:fixed; left:0; right:0; bottom:0; z-index:140;
  background:rgba(5,10,7,.97); border-top:1px solid var(--dim);
  padding:16px 16px calc(16px + env(safe-area-inset-bottom));}
.sh-h{color:var(--live); letter-spacing:3px; margin-bottom:8px;}
#sheet-body>div{margin:4px 0; font-size:13px; line-height:1.5;}
/* ending */
#ending .center{justify-content:flex-start; padding-top:8vh; text-align:left; align-items:stretch;}
.e-grade{color:var(--amber); font-size:22px; letter-spacing:4px; margin:8px 0;}
#ending p{line-height:1.7; margin:8px 0; font-size:13px;}
.e-report{margin:14px 0;}
.e-row{display:flex; justify-content:space-between; font-size:12px;
  padding:4px 0; border-bottom:1px dotted var(--dead);}
.e-promo{color:var(--live); letter-spacing:2px; text-align:center; margin-top:18px;}
.e-promo a, .tagline a{color:var(--live); text-decoration:underline; text-underline-offset:3px;}
/* menu */
#menubtn{position:fixed; top:calc(8px + env(safe-area-inset-top)); right:10px; z-index:200;
  min-height:36px; padding:6px 12px; font-size:12px; opacity:.8;}
#menu{z-index:210;}
#menu .center{gap:10px;}
#menu button{width:100%; max-width:340px;}
#m-io{width:100%; max-width:340px; background:var(--panel); color:var(--text);
  border:1px solid var(--dead); font:inherit; font-size:11px; padding:8px; min-height:70px;}
</style>
</head>
<body>
<canvas id="board"></canvas>
<div id="scan"></div>
<div id="vig"></div>
<button id="menubtn">MENU</button>

<div id="title" class="overlay hidden">
  <div class="center">
    <h1>GRID DOWN</h1>
    <h2>BLACK START</h2>
    <p class="tagline">The valley went dark at 4:17 on a Tuesday. You are the one who brings it back. Thirty days, one dam, and a board full of question marks.</p>
    <button id="t-continue" class="t-open hidden">CONTINUE RUN</button>
    <button id="t-book" class="t-open">BY THE BOOK<small>The standard scenario. Four line crews, two techs, 30 days.</small></button>
    <button id="t-short" class="t-open">SHORT-STAFFED<small>Three crews, and the town knows the union sent who it could. +1 trust.</small></button>
    <button id="t-ice" class="t-open">ICE STORM<small>Winter start. All loads +15%, the freeze comes early.</small></button>
    <button id="t-exercise" class="t-open">ANNUAL EXERCISE<small>The ten-day tabletop drill. Learn the board. No consequences.</small></button>
    <button id="t-sound">SOUND: ON</button>
    <p class="tagline">A NyxTools game · Part three of the Same Tuesday trilogy</p>
    <p class="tagline">The same Tuesday, other lives:
      <a href="https://nyxtoolsdev.github.io/grid-down-game/" target="_blank" rel="noopener">GRID DOWN</a> ·
      <a href="https://nyxtoolsdev.github.io/grid-down-get-home/" target="_blank" rel="noopener">GET HOME</a></p>
  </div>
</div>

<div id="coldopen" class="overlay hidden">
  <div class="center">
    <div id="co-h"></div>
    <p id="co-p"></p>
    <button id="co-next">CONTINUE</button>
  </div>
</div>

<div id="brief" class="hidden"><div id="brief-body"></div></div>

<div id="eventmodal" class="overlay hidden">
  <div class="ev-card">
    <div id="ev-cat"></div>
    <div id="ev-text"></div>
    <div id="ev-choices"></div>
  </div>
</div>

<div id="logscreen" class="overlay hidden">
  <div id="log-lines"></div>
  <button id="log-next" class="hidden">DAWN →</button>
</div>

<div id="sheet" class="hidden"><div id="sheet-body"></div></div>

<div id="ending" class="overlay hidden">
  <div class="center"><div id="ending-body" style="max-width:520px;width:100%"></div></div>
</div>

<div id="menu" class="overlay hidden">
  <div class="center">
    <div class="sh-h">SYSTEM</div>
    <button id="m-sound">SOUND: ON</button>
    <button id="m-export">EXPORT SAVE</button>
    <textarea id="m-io" placeholder="save string"></textarea>
    <button id="m-import">IMPORT SAVE</button>
    <button id="m-abandon">ABANDON RUN</button>
    <button id="m-close">CLOSE</button>
  </div>
</div>

<script type="module" src="src/main.js"></script>
</body>
</html>
